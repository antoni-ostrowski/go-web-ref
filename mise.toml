[tools]
go = "1.27.0"
sqlc = "1.30.0"
"aqua:a-h/templ" = "v0.3.1020"
"aqua:ariga/atlas" = "latest"

[tasks.generate]
description = "Generate sqlc and templ code"
run = "sqlc generate && templ generate"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.test-race]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.test-integration]
description = "Run PostgreSQL integration tests (auto-starts and cleans up disposable container)"
run = """
docker rm -f go-htmx-todo-test-db >/dev/null 2>&1 || true
docker run --rm -d --name go-htmx-todo-test-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=todos -p 5432:5432 postgres:16-alpine
trap 'docker rm -f go-htmx-todo-test-db >/dev/null 2>&1' EXIT
for i in $(seq 1 30); do
  docker exec go-htmx-todo-test-db pg_isready -U postgres -d todos >/dev/null 2>&1 && break
  sleep 1
done
INTEGRATION_TESTS=1 go test ./internal/todo/handler -v
"""

[tasks.check]
description = "Run generators, vet, and tests"
depends = ["generate"]
run = "go vet ./... && go test ./..."

[tasks.db-apply]
description = "Apply desired schema to DATABASE_URL (Atlas declarative)"
run = "atlas schema apply --url \"${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/todos?sslmode=disable}\" --to \"file://internal/db/schema.sql\" --dev-url \"docker://postgres/16/dev\" --auto-approve"

[tasks.db-plan]
description = "Show planned schema changes without applying"
run = "atlas schema apply --url \"${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/todos?sslmode=disable}\" --to \"file://internal/db/schema.sql\" --dev-url \"docker://postgres/16/dev\" --dry-run"

[tasks.db-validate]
description = "Validate schema"
run = "atlas schema validate --url \"file://internal/db/schema.sql\" --dev-url \"docker://postgres/16/dev\""

[tasks.db]
description = "Start (or reuse) the local Postgres dev container"
run = """
if ! docker ps -q --filter "name=^go-htmx-todo-dev-db$" | grep -q .; then
  docker rm -f go-htmx-todo-dev-db >/dev/null 2>&1 || true
  docker run --rm -d --name go-htmx-todo-dev-db \
    -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=todos \
    -p 5432:5432 postgres:16-alpine
fi
for i in $(seq 1 30); do
  docker exec go-htmx-todo-dev-db pg_isready -U postgres -d todos >/dev/null 2>&1 && break
  sleep 1
done
echo "dev db ready on localhost:5432 (postgres/postgres, db: todos)"
"""

[tasks.dev]
description = "Run the web app (starts the dev Postgres container first)"
depends = ["db"]
run = "go run ."
